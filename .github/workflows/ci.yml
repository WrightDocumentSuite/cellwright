name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Never let a developer-built package from the runner's global cache satisfy restore.
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-cache

jobs:
  build:
    # Both, because the file paths and the culture data differ enough to hide bugs on one of them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'NuGet.Config', 'nuget.config', 'Directory.Build.props', 'Directory.Packages.props', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json') }}

      - run: dotnet restore Cellwright.slnx --locked-mode

      # Warnings are errors in Directory.Build.props, so a clean build is part of the contract.
      - run: dotnet build Cellwright.slnx -c Release --no-restore

      # Pull requests use the fast repository fixtures. The separately pinned upstream corpus
      # is exercised by Corpus integration, where the TRX gate rejects unexpected skips.
      - run: dotnet test Cellwright.slnx -c Release --no-build --no-restore --verbosity normal

      # Again under a culture whose decimal separator is a comma. A spreadsheet is written the
      # same way wherever it is produced, and one parse that forgets to say so makes a file
      # that is wrong in Berlin and right in Boston — invisible to a suite run under one locale.
      - name: Test under another culture
        if: matrix.os == 'ubuntu-latest'
        env:
          CELLWRIGHT_TEST_CULTURE: ru-RU
        run: dotnet test Cellwright.slnx -c Release --no-build --no-restore --verbosity normal

      - name: Verify packages
        id: packages
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./eng/verify-packages.ps1 -RuntimeIdentifier linux-x64

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cellwright-packages
          path: |
            ${{ steps.packages.outputs.package-directory }}/*.nupkg
            ${{ steps.packages.outputs.package-directory }}/*.snupkg
          if-no-files-found: error
